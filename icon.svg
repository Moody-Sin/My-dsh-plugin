<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="聚合插件总线">
  <title>聚合插件总线 (Umbrella Loader)</title>
  <defs>
    <linearGradient id="umbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="umbCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#umbBg)"/>

  <!-- 总线走线：由中心枢纽向六个卫星插件节点辐射 -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <path d="M32 32 L32 13"/>
    <path d="M32 32 L48.5 22.5"/>
    <path d="M32 32 L48.5 41.5"/>
    <path d="M32 32 L32 51"/>
    <path d="M32 32 L15.5 41.5"/>
    <path d="M32 32 L15.5 22.5"/>
  </g>

  <!-- 卫星子插件节点 -->
  <g fill="#FFFFFF">
    <circle cx="32" cy="13" r="4"/>
    <circle cx="48.5" cy="22.5" r="4"/>
    <circle cx="48.5" cy="41.5" r="4"/>
    <circle cx="32" cy="51" r="4"/>
    <circle cx="15.5" cy="41.5" r="4"/>
    <circle cx="15.5" cy="22.5" r="4"/>
  </g>

  <!-- 中心枢纽：圆角方芯 + 内部插槽，象征统一挂载点 -->
  <rect x="20" y="20" width="24" height="24" rx="7" fill="url(#umbCore)"/>
  <g fill="#4F46E5">
    <rect x="26" y="26.5" width="12" height="2.5" rx="1.25"/>
    <rect x="26" y="30.75" width="12" height="2.5" rx="1.25"/>
    <rect x="26" y="35" width="12" height="2.5" rx="1.25"/>
  </g>
</svg>
